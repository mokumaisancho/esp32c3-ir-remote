name: ROM evidence-driven 88-to-discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rom_automation/*.py'
      - 'rom_automation/reviewed_semantics.json'
      - '.github/workflows/rom-evidence-autopilot.yml'
  workflow_run:
    workflows: ['ESP32-C3 ROM 88 candidate Ghidra review']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: rom-evidence-autopilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review-original-88:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      discover: ${{ steps.gate.outputs.discover }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyelftools==0.32
      - name: Restore hashed vendor ELF and Ghidra reports
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom_evidence" rom_automation/output
          GHIDRA_ID=12180348551
          GHIDRA_DIGEST=4a6dc279579db43844de466d0a9ff5b57dba54528f87e8c2cb4ef28387db5ea0
          if [ -n "$UPSTREAM_RUN" ]; then
            curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/mokumaisancho/esp32c3-ir-remote/actions/runs/$UPSTREAM_RUN/artifacts" -o "$RUNNER_TEMP/rom_evidence/source.json"
            GHIDRA_ID=$(jq -r '.artifacts[] | select(.name=="esp32c3-rom-88-ghidra-evidence") | .id' "$RUNNER_TEMP/rom_evidence/source.json" | head -n 1)
            GHIDRA_DIGEST=$(jq -r '.artifacts[] | select(.name=="esp32c3-rom-88-ghidra-evidence") | .digest | sub("^sha256:";"")' "$RUNNER_TEMP/rom_evidence/source.json" | head -n 1)
            test -n "$GHIDRA_ID"
            echo "$GHIDRA_DIGEST" | grep -Eq '^[a-f0-9]{64}$'
          fi
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/mokumaisancho/esp32c3-ir-remote/actions/artifacts/$GHIDRA_ID/zip" -o "$RUNNER_TEMP/rom_evidence/ghidra.zip"
          printf '%s  %s\n' "$GHIDRA_DIGEST" "$RUNNER_TEMP/rom_evidence/ghidra.zip" | sha256sum -c -
          echo "$GHIDRA_DIGEST" > rom_automation/output/ghidra_expected_sha.txt
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/mokumaisancho/esp32c3-ir-remote/actions/artifacts/12180128997/zip" -o "$RUNNER_TEMP/rom_evidence/machine.zip"
          printf '%s  %s\n' cc08989ed0967d091b9d63eae9e714a661d03604fc54c6c57778b034ee264896 "$RUNNER_TEMP/rom_evidence/machine.zip" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/rom_evidence/"*.zip | tee rom_automation/output/source_hashes.log
      - name: Test actual 88 cases and false-positive guards
        env:
          ROM_GHIDRA_ZIP: ${{ runner.temp }}/rom_evidence/ghidra.zip
          ROM_MACHINE_ZIP: ${{ runner.temp }}/rom_evidence/machine.zip
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_*.py' -v 2>&1 | tee rom_automation/output/negative_controls.log
      - name: Reconcile candidate evidence and compute independent-gated trigger
        id: gate
        run: |
          set -euo pipefail
          python rom_automation/decision_gate.py --ghidra "$RUNNER_TEMP/rom_evidence/ghidra.zip" --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --review rom_automation/reviewed_semantics.json --ghidra-sha "$(cat rom_automation/output/ghidra_expected_sha.txt)" --out rom_automation/output 2>&1 | tee rom_automation/output/decision.log
          cat rom_automation/output/gate.env >> "$GITHUB_OUTPUT"
          cat rom_automation/output/gate.env >> "$GITHUB_STEP_SUMMARY"
      - name: Generate next eight exact machine/Decompiler review packets
        run: |
          set -euo pipefail
          python rom_automation/next_candidate_dossiers.py --ghidra "$RUNNER_TEMP/rom_evidence/ghidra.zip" --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --state rom_automation/output/state.json --out rom_automation/output/next_batch 2>&1 | tee rom_automation/output/next_batch.log
      - name: Analyze remaining 51 semantic gaps (returns != indirect calls)
        run: |
          set -euo pipefail
          python rom_automation/semantic_frontier.py --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --state rom_automation/output/state.json --out rom_automation/output/semantic_frontier_51.json 2>&1 | tee rom_automation/output/semantic_frontier.log
      - name: Verify two additional original ROM effects
        run: |
          set -euo pipefail
          python rom_automation/two_linear_effects.py --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --out rom_automation/output/two_linear_effects.json 2>&1 | tee rom_automation/output/two_linear_effects.log
      - name: Verify four additional branch-and-MMIO bounded ISA effects
        run: |
          set -euo pipefail
          python rom_automation/bounded_isa_effects.py --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --ghidra "$RUNNER_TEMP/rom_evidence/ghidra.zip" --out rom_automation/output/bounded_isa_effects.json 2>&1 | tee rom_automation/output/bounded_isa_effects.log
      - name: Validate AGC register net effects across three ROM revisions
        run: |
          set -euo pipefail
          python rom_automation/agc_rom_effects.py --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --ghidra "$RUNNER_TEMP/rom_evidence/ghidra.zip" --out rom_automation/output/agc_rom_effects.json 2>&1 | tee rom_automation/output/agc_rom_effects.log
      - name: Reconstruct byte-decoded local control flow for original 88 functions
        run: |
          set -euo pipefail
          python rom_automation/rom_candidate_cfg.py --machine "$RUNNER_TEMP/rom_evidence/machine.zip" --out rom_automation/output/rom_candidate_cfg.json 2>&1 | tee rom_automation/output/rom_candidate_cfg.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-autopilot-88-state-full-logs
          path: rom_automation/output/
          retention-days: 90
          if-no-files-found: error
  discover-other-rom-functions:
    needs: review-original-88
    if: needs.review-original-88.outputs.discover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyelftools==0.32
      - uses: actions/download-artifact@v4
        with:
          name: rom-autopilot-88-state-full-logs
          path: rom_automation/output/
      - name: Enumerate other official ELF functions only after verified closure
        run: |
          set -euo pipefail
          python rom_automation/after_88_discovery.py --state rom_automation/output/state.json --out rom_automation/output/discovery 2>&1 | tee rom_automation/output/discovery.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-autopilot-new-functions-and-logs
          path: rom_automation/output/
          retention-days: 90
          if-no-files-found: error
