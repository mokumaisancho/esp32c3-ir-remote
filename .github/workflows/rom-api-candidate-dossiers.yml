name: ROM-001 candidate API machine-byte dossiers
on:
  push:
    branches: [main]
    paths:
      - 'rom_automation/rom_api_candidate_dossier.py'
      - 'rom_automation/test_rom_api_candidate_dossier.py'
      - 'rom_automation/rom_api_candidate_semantics.py'
      - 'rom_automation/test_rom_api_candidate_semantics.py'
      - '.github/workflows/rom-api-candidate-dossiers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independently pinned parsers
        run: python -m pip install --disable-pip-version-check pyelftools==0.32 capstone==5.0.6
      - name: Test explicit negative controls
        run: |
          mkdir -p rom_automation/output/api_candidates
          set -o pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_api_candidate_dossier.py' -v 2>&1 | tee rom_automation/output/api_candidates/tests.log
      - name: Download the exact immutable public official ROM bundle
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 'https://github.com/espressif/esp-rom-elfs/releases/download/20260528/esp-rom-elfs-20260528.tar.gz' -o /tmp/esp-rom-elfs.tar.gz
          echo 'caa463d3cbef2430a5a35847c1d9f2f152403b17a802050927ff60c8da54fe46  /tmp/esp-rom-elfs.tar.gz' | sha256sum -c
      - name: Enumerate exact API code and all instructions
        run: |
          set -euo pipefail
          python rom_automation/rom_api_candidate_dossier.py --rom /tmp/esp-rom-elfs.tar.gz --out rom_automation/output/api_candidates/full_rom_api_dossiers.json 2>&1 | tee rom_automation/output/api_candidates/results.log
          sha256sum rom_automation/output/api_candidates/*.json | tee rom_automation/output/api_candidates/output_sha256.log
      - name: Falsify arithmetic formula against pinned RV32C instructions and encoded-mutant controls
        env:
          ROM_DOSSIER_JSON: rom_automation/output/api_candidates/full_rom_api_dossiers.json
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_api_candidate_semantics.py' -v 2>&1 | tee rom_automation/output/api_candidates/semantics_tests.log
          python rom_automation/rom_api_candidate_semantics.py --dossier "$ROM_DOSSIER_JSON" --out rom_automation/output/api_candidates/rom2_temp_to_power1_semantics.json 2>&1 | tee rom_automation/output/api_candidates/semantics_results.log
          sha256sum rom_automation/output/api_candidates/rom2_temp_to_power1_semantics.json | tee rom_automation/output/api_candidates/semantics_sha256.log
      - uses: actions/upload-artifact@v4
        with:
          name: rom001-pinned-api-dossiers
          path: rom_automation/output/api_candidates/
          retention-days: 90
          if-no-files-found: error
