name: Build ESP32-C3 firmware

on:
  push:
    branches: [main, fix/rmt-idf-error-diagnostics]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Mac diagnostic Python syntax
        run: python -m py_compile scripts/diagnose_wifi_usb.py scripts/wifi_trace_runner.py
      - name: Check source-to-test impact contracts
        run: python scripts/check_impact.py
      - name: Test Wi-Fi and 5-second IR capture code (real function + mocked HAL)
        run: python -m unittest discover -s tests -v
      - name: Run isolated native UT
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude test/native/test_diagnostic_policy.cpp -o /tmp/ir-policy-test
          /tmp/ir-policy-test
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Build
        run: pio run -e esp32-c3-devkitm-1
      - name: Collect firmware
        run: |
          mkdir -p artifact
          cp .pio/build/esp32-c3-devkitm-1/bootloader.bin artifact/
          cp .pio/build/esp32-c3-devkitm-1/partitions.bin artifact/
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin artifact/
          cp .pio/build/esp32-c3-devkitm-1/firmware.elf artifact/
          BOOT_APP0="$(find "$HOME/.platformio/packages" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" artifact/boot_app0.bin
          cat > artifact/FLASH_LAYOUT.txt <<'EOF'
          0x0000 bootloader.bin
          0x8000 partitions.bin
          0xE000 boot_app0.bin
          0x10000 firmware.bin
          EOF
          printf '%s\n' "$GITHUB_SHA" > artifact/SOURCE_SHA.txt
          sha256sum artifact/* > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32c3-ir-remote-firmware
          path: artifact/
          if-no-files-found: error

      - name: Build independent WiFiManager POC
        run: pio run -e esp32-c3-wifi-poc
      - name: Package independent WiFiManager POC
        run: |
          mkdir -p wifi-poc-artifact
          for f in bootloader.bin partitions.bin firmware.bin firmware.elf; do cp ".pio/build/esp32-c3-wifi-poc/$f" wifi-poc-artifact/; done
          cp artifact/boot_app0.bin wifi-poc-artifact/boot_app0.bin
          cp artifact/FLASH_LAYOUT.txt wifi-poc-artifact/FLASH_LAYOUT.txt
          cp artifact/SOURCE_SHA.txt wifi-poc-artifact/SOURCE_SHA.txt
          sha256sum wifi-poc-artifact/* > wifi-poc-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32c3-wifimanager-poc
          path: wifi-poc-artifact/
          if-no-files-found: error
