name: Public ESP32-C3 ROM ELF research
on:
  push:
    paths:
      - 'research/esp32c3_rom_public/**'
      - '.github/workflows/esp32c3-rom-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyelftools==0.32 capstone==5.0.6
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils-riscv64-linux-gnu
      - run: python -m unittest discover -s research/esp32c3_rom_public -p 'test_*.py' -v
      - run: python research/esp32c3_rom_public/audit_entries.py
      - run: python research/esp32c3_rom_public/independent_objdump.py
      - run: python research/esp32c3_rom_public/analyze.py
      - run: python research/esp32c3_rom_public/reconcile.py
      - run: python research/esp32c3_rom_public/fast_reconcile.py
      - run: python research/esp32c3_rom_public/section_quality.py
      - run: python research/esp32c3_rom_public/entry_probe.py
      - run: python research/esp32c3_rom_public/target_validate.py
      - run: python research/esp32c3_rom_public/register_access.py
      - run: python research/esp32c3_rom_public/register_base_compare.py
      - run: python research/esp32c3_rom_public/published_prior_art.py
      - run: python research/esp32c3_rom_public/exact_register_headers.py
      - run: python research/esp32c3_rom_public/candidate_rank.py
      - run: python research/esp32c3_rom_public/verify_target_rows.py
      - run: python research/esp32c3_rom_public/quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32c3-public-rom-results
          path: research/esp32c3_rom_public/output/
          if-no-files-found: warn
