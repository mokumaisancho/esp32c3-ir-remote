name: Public ESP32-C3 ROM ELF research
on:
  push:
    paths:
      - 'research/esp32c3_rom_public/**'
      - '.github/workflows/esp32c3-rom-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyelftools==0.32 capstone==5.0.6
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils-riscv64-linux-gnu
      - run: python -m unittest discover -s research/esp32c3_rom_public -p 'test_*.py' -v 2>&1 | tee research/esp32c3_rom_public/unit_tests.stdout.log
        shell: bash
      - run: python research/esp32c3_rom_public/run_all_with_full_logs.py
      - run: python research/esp32c3_rom_public/original_ac_adjudication.py
      - run: python research/esp32c3_rom_public/ac05_source_audit.py 2>&1 | tee research/esp32c3_rom_public/ac05_source_audit.log
        shell: bash
      - run: python research/esp32c3_rom_public/ac05_prior_art_countercheck.py 2>&1 | tee research/esp32c3_rom_public/ac05_prior_art_countercheck.log
        shell: bash
      - run: python research/esp32c3_rom_public/novelty_falsification.py 2>&1 | tee research/esp32c3_rom_public/novelty_falsification.log
        shell: bash
      - name: Integrate pinned ESP-IDF linker and register knowledge
        run: python research/esp32c3_rom_public/idf_known_inventory.py 2>&1 | tee research/esp32c3_rom_public/idf_known_inventory.log
        shell: bash
      - name: Analyze all 88 ROM candidate bodies
        run: python research/esp32c3_rom_public/candidate_full_audit.py 2>&1 | tee research/esp32c3_rom_public/candidate_full_audit.log
        shell: bash
      - run: python research/esp32c3_rom_public/candidate_mechanisms.py 2>&1 | tee research/esp32c3_rom_public/candidate_mechanisms.log
        shell: bash
      - name: Verify revision-specific disabled BLE entry
        run: python research/esp32c3_rom_public/eco_disabled_entry_probe.py 2>&1 | tee research/esp32c3_rom_public/eco_disabled_entry.log
        shell: bash
      - name: Reconcile all 46 linker-unmatched names with dated prior ROM catalogs
        run: python research/esp32c3_rom_public/prior_catalog_name_audit.py 2>&1 | tee research/esp32c3_rom_public/prior_catalog_name_audit.log
        shell: bash
      - name: Verify deterministic ISA effects of 17 leaf functions
        run: python research/esp32c3_rom_public/leaf_isa_effect_differential.py 2>&1 | tee research/esp32c3_rom_public/leaf_isa_effect_differential.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32c3-public-rom-results
          path: |
            research/esp32c3_rom_public/output/
            research/esp32c3_rom_public/unit_tests.stdout.log
            research/esp32c3_rom_public/ac05_source_audit.log
            research/esp32c3_rom_public/ac05_prior_art_countercheck.log
            research/esp32c3_rom_public/novelty_falsification.log
            research/esp32c3_rom_public/idf_known_inventory.log
            research/esp32c3_rom_public/candidate_full_audit.log
            research/esp32c3_rom_public/candidate_mechanisms.log
            research/esp32c3_rom_public/eco_disabled_entry.log
            research/esp32c3_rom_public/prior_catalog_name_audit.log
            research/esp32c3_rom_public/leaf_isa_effect_differential.log
          if-no-files-found: warn
