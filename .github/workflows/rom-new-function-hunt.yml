name: ROM-001 exploratory new-function discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rom_automation/new_function_hunt.py'
      - 'rom_automation/new_function_triage.py'
      - 'rom_automation/rom_fast_graph.py'
      - 'rom_automation/rom_gap_branch_seeds.py'
      - 'rom_automation/rom_p0a_indirect_roots.py'
      - 'rom_automation/rom_p0a_entry_trampoline.py'
      - 'rom_automation/test_rom_p0a_entry_trampoline.py'
      - 'rom_automation/test_rom_p0a_indirect_roots.py'
      - 'rom_automation/rom_p0b_vendor_exact.py'
      - 'rom_automation/test_rom_p0b_vendor_exact.py'
      - 'rom_automation/rom_mmio_revision_diff.py'
      - 'rom_automation/test_rom_mmio_revision_diff.py'
      - 'rom_automation/test_rom_gap_branch_seeds.py'
      - 'rom_automation/rom_pointer_tables.py'
      - 'rom_automation/rom_strict_indirect.py'
      - 'rom_automation/rom_sram_writer_audit.py'
      - 'rom_automation/rom_sram_literal_refs.py'
      - 'rom_automation/rom_sram_vendor_symbols.py'
      - 'rom_automation/test_rom_sram_vendor_symbols.py'
      - 'rom_automation/test_rom_sram_literal_refs.py'
      - 'rom_automation/test_rom_sram_writer_audit.py'
      - 'rom_automation/test_rom_strict_indirect.py'
      - 'rom_automation/test_rom_pointer_tables.py'
      - 'rom_automation/test_rom_fast_graph.py'
      - 'rom_automation/test_new_function_triage.py'
      - 'rom_automation/test_new_function_hunt.py'
      - '.github/workflows/rom-new-function-hunt.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: rom-new-function-hunt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan-all-three-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyelftools==0.32 capstone==5.0.6
      - name: Retrieve and SHA-256 verify pinned official ROM and original-88 census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom_discovery" rom_automation/output/new_function_hunt
          printf "CENSUS_INPUT_SHA_STAGE_STARTED\\n" > rom_automation/output/new_function_hunt/preflight.log
          curl -fL --retry 3 --connect-timeout 30 \
            'https://github.com/espressif/esp-rom-elfs/releases/download/20260528/esp-rom-elfs-20260528.tar.gz' \
            -o "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz"
          printf '%s  %s\n' caa463d3cbef2430a5a35847c1d9f2f152403b17a802050927ff60c8da54fe46 "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" | sha256sum -c
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/mokumaisancho/esp32c3-ir-remote/actions/artifacts/12180128997/zip' \
            -o "$RUNNER_TEMP/rom_discovery/original-88.zip"
          printf '%s  %s\n' cc08989ed0967d091b9d63eae9e714a661d03604fc54c6c57778b034ee264896 "$RUNNER_TEMP/rom_discovery/original-88.zip" | sha256sum -c
          sha256sum "$RUNNER_TEMP/rom_discovery/"* | tee rom_automation/output/new_function_hunt/input_sha256.log
      - name: Run isolated negative controls
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_new_function*.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/unit_tests.log
      - name: Scan all official ELF symbols and direct transfers into symbol-size gaps
        run: |
          set -euo pipefail
          python rom_automation/new_function_hunt.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --machine "$RUNNER_TEMP/rom_discovery/original-88.zip" \
            --out rom_automation/output/new_function_hunt/complete_exploratory_census.json \
            2>&1 | tee rom_automation/output/new_function_hunt/census.log
      - name: Regression on SCC cycles and 40 independent Bellman-Ford shortest paths
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_fast_graph.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/graph_tests.log
      - name: Run linear-pass indexed all-ROM function disassembly plus SCC task graph
        run: |
          set -euo pipefail
          python rom_automation/rom_fast_graph.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --census rom_automation/output/new_function_hunt/complete_exploratory_census.json \
            --out rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            2>&1 | tee rom_automation/output/new_function_hunt/fast_graph.log
      - name: Verify independent RV32IMC conditional branch decoders and weighted nonoverlap DP
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_gap_branch_seeds.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/gap_branch_tests.log
      - name: Find verified symbol-origin B and compressed branches into unknown executable gaps
        run: |
          set -euo pipefail
          python rom_automation/rom_gap_branch_seeds.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/P0A_RV32IMC_gap_branch_WIS.json \
            2>&1 | tee rom_automation/output/new_function_hunt/gap_branch_wis.log
      - name: Verify RV32 peripheral read/store patterns and vendor-base vs exact-register distinction
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_mmio_revision_diff.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/P0B_MMIO_tests.log
      - name: Compare identical ROM function names for revision-specific peripheral and CSR effects
        run: |
          set -euo pipefail
          python rom_automation/rom_mmio_revision_diff.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/P0B_MMIO_revision_delta.json \
            2>&1 | tee rom_automation/output/new_function_hunt/P0B_MMIO_revision_delta.log
      - name: Test P0-A ELF symbol-size gaps and nonexecuting pointer target lookups
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_p0a_indirect_roots.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/P0A_indirect_roots_tests.log
      - name: Search executable gap roots from ROM nonexecuting tables and ELF symbols
        run: |
          set -euo pipefail
          python rom_automation/rom_p0a_indirect_roots.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/P0A_indirect_gap_roots.json \
            2>&1 | tee rom_automation/output/new_function_hunt/P0A_indirect_roots.log
      - name: Test real rev0, rev101, rev3 ELF-entry direct JAL machine encodings
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_p0a_entry_trampoline.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/P0A_entry_jump_tests.log
      - name: Trace actual official ELF entrypoint into unlabelled ROM code
        run: |
          set -euo pipefail
          python rom_automation/rom_p0a_entry_trampoline.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/P0A_official_ROM_entry_jump_chains.json \
            2>&1 | tee rom_automation/output/new_function_hunt/P0A_entry_jump_chains.log
      - name: Test exact vendor register macro matches and corruption controls
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_p0b_vendor_exact.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/P0B_vendor_exact_tests.log
      - name: Match all 13 static ROM register deltas against vendor pinned register headers
        run: |
          set -euo pipefail
          python rom_automation/rom_p0b_vendor_exact.py \
            --p0b rom_automation/output/new_function_hunt/P0B_MMIO_revision_delta.json \
            --out rom_automation/output/new_function_hunt/P0B_vendor_all13_exact_registers.json \
            2>&1 | tee rom_automation/output/new_function_hunt/P0B_vendor_exact.log
      - name: Validate ROM pointer-table scanning false-positive controls
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_pointer_tables.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/pointer_tests.log
      - name: Scan allocated ROM data for exact function-entry pointer evidence
        run: |
          set -euo pipefail
          python rom_automation/rom_pointer_tables.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/all_rom_function_pointer_refs.json \
            2>&1 | tee rom_automation/output/new_function_hunt/pointer_refs.log
      - name: Test raw RISC-V indirect decoding with malicious and false-positive controls
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_strict_indirect.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/indirect_tests.log
      - name: Recover provable AUIPC LUI materialized indirect callee candidates
        run: |
          set -euo pipefail
          python rom_automation/rom_strict_indirect.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --out rom_automation/output/new_function_hunt/strict_indirect_edges.json \
            2>&1 | tee rom_automation/output/new_function_hunt/indirect_edges.log
      - name: Validate SRAM writer provenance with six encoded machine-byte counterexamples
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_sram_writer_audit.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/sram_writer_tests.log
      - name: Trace precise ROM-side write sites for 13 SRAM indirect dispatch addresses
        run: |
          set -euo pipefail
          python rom_automation/rom_sram_writer_audit.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --strict rom_automation/output/new_function_hunt/strict_indirect_edges.json \
            --out rom_automation/output/new_function_hunt/ROM_SRAM_writer_sites.json \
            2>&1 | tee rom_automation/output/new_function_hunt/sram_writer_sites.log
      - name: Verify literal-reference scanner controls
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_sram_literal_refs.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/sram_literal_tests.log
      - name: Check whether remaining nine SRAM dispatch slots appear in ROM initialized data
        run: |
          set -euo pipefail
          python rom_automation/rom_sram_literal_refs.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --strict rom_automation/output/new_function_hunt/strict_indirect_edges.json \
            --writer rom_automation/output/new_function_hunt/ROM_SRAM_writer_sites.json \
            --out rom_automation/output/new_function_hunt/remaining_9_sram_literal_references.json \
            2>&1 | tee rom_automation/output/new_function_hunt/remaining_sram_literals.log
      - name: Retrieve pinned Espressif ROM linker symbol labels
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            'https://raw.githubusercontent.com/espressif/esp-idf/383dda6c182e3dabf6355160166fe007df775629/components/esp_rom/esp32c3/ld/esp32c3.rom.ld' \
            -o "$RUNNER_TEMP/rom_discovery/esp32c3.rom.ld"
          test "$(git hash-object "$RUNNER_TEMP/rom_discovery/esp32c3.rom.ld")" = 'f615f3ac3a5125837c74636463bec92b6db2465b'
          git hash-object "$RUNNER_TEMP/rom_discovery/esp32c3.rom.ld" | tee rom_automation/output/new_function_hunt/vendor_linker_blob_sha1.log
      - name: Test pinned vendor symbol provenance and mutation rejection
        env:
          ROM_VENDOR_LD: ${{ runner.temp }}/rom_discovery/esp32c3.rom.ld
          ROM_FAST_GRAPH_JSON: rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json
          ROM_STRICT_JSON: rom_automation/output/new_function_hunt/strict_indirect_edges.json
          ROM_WRITER_JSON: rom_automation/output/new_function_hunt/ROM_SRAM_writer_sites.json
        run: |
          set -euo pipefail
          python -m unittest discover -s rom_automation -p 'test_rom_sram_vendor_symbols.py' -v 2>&1 | tee rom_automation/output/new_function_hunt/vendor_symbol_tests.log
      - name: Correlate remaining nine SRAM addresses against vendor linker names
        run: |
          set -euo pipefail
          python rom_automation/rom_sram_vendor_symbols.py \
            --strict rom_automation/output/new_function_hunt/strict_indirect_edges.json \
            --writer rom_automation/output/new_function_hunt/ROM_SRAM_writer_sites.json \
            --graph rom_automation/output/new_function_hunt/all_rom_functions_ECv4_graph.json \
            --vendor-ld "$RUNNER_TEMP/rom_discovery/esp32c3.rom.ld" \
            --git-blob f615f3ac3a5125837c74636463bec92b6db2465b \
            --out rom_automation/output/new_function_hunt/remaining_9_official_vendor_symbols.json \
            2>&1 | tee rom_automation/output/new_function_hunt/vendor_sram_symbols.log
      - name: Screen all 152 previously uncatalogued named ELF functions by exact opcode side effects
        run: |
          set -euo pipefail
          python rom_automation/new_function_triage.py \
            --rom "$RUNNER_TEMP/rom_discovery/esp-rom-elfs.tar.gz" \
            --census rom_automation/output/new_function_hunt/complete_exploratory_census.json \
            --out rom_automation/output/new_function_hunt/rev101_machine_screened_152.json \
            2>&1 | tee rom_automation/output/new_function_hunt/triage.log
      - name: Preserve exact reports and run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-001-complete-new-function-exploratory-evidence
          path: rom_automation/output/new_function_hunt/
          retention-days: 90
          if-no-files-found: error
